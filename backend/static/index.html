<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RNN Time-Series Forecasting Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
    </style>
</head>
<body class="text-gray-800 antialiased min-h-screen flex flex-col">
    <!-- Navbar -->
    <nav class="bg-indigo-600 shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center">
                    <i class="fas fa-chart-line text-white text-2xl mr-3"></i>
                    <span class="font-bold text-white text-xl">RNN Forecasting Dashboard</span>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full flex flex-col md:flex-row gap-8">
        
        <!-- Sidebar -->
        <aside class="w-full md:w-1/4 bg-white rounded-xl shadow-md p-6 h-fit">
            <h2 class="text-lg font-bold text-gray-800 mb-4 border-b pb-2">Model Configuration</h2>
            
            <label class="block text-sm font-medium text-gray-700 mb-2">Select Model</label>
            <select id="model-select" class="block w-full rounded-md border-gray-300 shadow-sm border p-2 mb-6 focus:border-indigo-500 focus:ring-indigo-500">
                <option value="">Loading models...</option>
            </select>
            
            <div id="model-info" class="text-sm text-gray-600 bg-gray-50 p-4 rounded-lg hidden mb-6">
                <p><strong>Framework:</strong> <span id="info-framework"></span></p>
                <p><strong>Target:</strong> <span id="info-target"></span></p>
                <p><strong>Seq Length:</strong> <span id="info-seq"></span></p>
            </div>

            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-2">Start Date</label>
                <input type="date" id="start-date" class="block w-full rounded-md border-gray-300 shadow-sm border p-2 focus:border-indigo-500 focus:ring-indigo-500">
            </div>

            <div class="mb-8">
                <label class="block text-sm font-medium text-gray-700 mb-2">End Date</label>
                <input type="date" id="end-date" class="block w-full rounded-md border-gray-300 shadow-sm border p-2 focus:border-indigo-500 focus:ring-indigo-500">
            </div>

            <button id="predict-btn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-lg transition duration-200 flex items-center justify-center">
                <i class="fas fa-magic mr-2"></i> Predict Range
            </button>
        </aside>

        <!-- Content Area -->
        <div class="w-full md:w-3/4 flex flex-col gap-6">
            
            <!-- Metrics Cards -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <div class="bg-white rounded-xl shadow-md p-5 border-l-4 border-blue-500">
                    <p class="text-sm text-gray-500 font-semibold mb-1">RMSE (Test Set)</p>
                    <p id="metric-rmse" class="text-2xl font-bold text-gray-800">--</p>
                </div>
                <div class="bg-white rounded-xl shadow-md p-5 border-l-4 border-green-500">
                    <p class="text-sm text-gray-500 font-semibold mb-1">MAE (Test Set)</p>
                    <p id="metric-mae" class="text-2xl font-bold text-gray-800">--</p>
                </div>
                <div class="bg-white rounded-xl shadow-md p-5 border-l-4 border-yellow-500">
                    <p class="text-sm text-gray-500 font-semibold mb-1">MAPE (Test Set)</p>
                    <p id="metric-mape" class="text-2xl font-bold text-gray-800">--</p>
                </div>
                <div class="bg-white rounded-xl shadow-md p-5 border-l-4 border-purple-500">
                    <p class="text-sm text-gray-500 font-semibold mb-1">Directional Acc</p>
                    <p id="metric-dir" class="text-2xl font-bold text-gray-800">--</p>
                </div>
            </div>

            <!-- Chart Card -->
            <div class="bg-white rounded-xl shadow-md p-6 flex-grow flex flex-col">
                <h3 class="text-lg font-bold text-gray-800 mb-4">Time Series Range Prediction</h3>
                <div id="chart-container" class="relative flex-grow w-full" style="min-height: 400px;">
                    <canvas id="predictionChart"></canvas>
                </div>
            </div>
        </div>
    </main>

    <script>
        let models = [];
        let selectedModel = null;
        let chartInstance = null;

        // Elements
        const selectEl = document.getElementById('model-select');
        const startDateEl = document.getElementById('start-date');
        const endDateEl = document.getElementById('end-date');
        const predictBtn = document.getElementById('predict-btn');
        const ctx = document.getElementById('predictionChart').getContext('2d');

        // Fetch models
        fetch('/api/models')
            .then(res => res.json())
            .then(data => {
                models = data;
                selectEl.innerHTML = '';
                data.forEach((m, idx) => {
                    const opt = document.createElement('option');
                    opt.value = m.name;
                    opt.textContent = m.name;
                    selectEl.appendChild(opt);
                });
                
                if(data.length > 0) {
                    onModelChange(data[0].name);
                }
            });

        selectEl.addEventListener('change', (e) => onModelChange(e.target.value));

        function onModelChange(modelName) {
            selectedModel = models.find(m => m.name === modelName);
            
            document.getElementById('model-info').classList.remove('hidden');
            document.getElementById('info-framework').textContent = selectedModel.framework.toUpperCase();
            document.getElementById('info-target').textContent = selectedModel.target;
            document.getElementById('info-seq').textContent = selectedModel.seq_length;
            
            const metrics = selectedModel.metrics;
            document.getElementById('metric-rmse').textContent = metrics.rmse ? metrics.rmse.toFixed(4) : '--';
            document.getElementById('metric-mae').textContent = metrics.mae ? metrics.mae.toFixed(4) : '--';
            document.getElementById('metric-mape').textContent = metrics.mape ? metrics.mape.toFixed(4) : '--';
            document.getElementById('metric-dir').textContent = metrics.directional_acc ? (metrics.directional_acc * 100).toFixed(2) + '%' : '--';
            
            // Set date constraints
            startDateEl.min = selectedModel.min_date;
            startDateEl.max = selectedModel.max_date;
            endDateEl.min = selectedModel.min_date;
            endDateEl.max = selectedModel.max_date;
            
            // Default select a range of the last 100 days
            const dMax = new Date(selectedModel.max_date);
            const dStart = new Date(dMax);
            dStart.setDate(dStart.getDate() - 100);
            
            startDateEl.value = dStart.toISOString().split('T')[0];
            endDateEl.value = dMax.toISOString().split('T')[0];
            
            // Trigger initial predict
            doPredict();
        }

        predictBtn.addEventListener('click', doPredict);

        async function doPredict() {
            if(!selectedModel) return;
            
            predictBtn.disabled = true;
            predictBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Predicting...';
            
            try {
                const res = await fetch('/api/predict_range', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        model_name: selectedModel.name,
                        start_date: startDateEl.value,
                        end_date: endDateEl.value
                    })
                });
                
                const data = await res.json();
                renderChart(data);
            } catch (e) {
                console.error(e);
                alert("Error making prediction");
            } finally {
                predictBtn.disabled = false;
                predictBtn.innerHTML = '<i class="fas fa-magic mr-2"></i> Predict Range';
            }
        }

        function renderChart(data) {
            if (chartInstance) {
                chartInstance.destroy();
            }
            
            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: data.dates,
                    datasets: [
                        {
                            label: `Actual Price (${data.unit})`,
                            data: data.actuals,
                            borderColor: '#10b981',
                            backgroundColor: 'rgba(16, 185, 129, 0.1)',
                            borderWidth: 2,
                            fill: false,
                            tension: 0.1,
                            pointRadius: 0,
                            pointHoverRadius: 4
                        },
                        {
                            label: `Predicted Price (${data.unit})`,
                            data: data.predictions,
                            borderColor: '#ef4444',
                            backgroundColor: 'rgba(239, 68, 68, 0.1)',
                            borderWidth: 2,
                            borderDash: [5, 5],
                            fill: false,
                            tension: 0.1,
                            pointRadius: 0,
                            pointHoverRadius: 4
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: { mode: 'index', intersect: false },
                    plugins: {
                        legend: { position: 'top' },
                        tooltip: { enabled: true }
                    },
                    scales: {
                        y: { title: { display: true, text: `Price (${data.unit})` } },
                        x: { title: { display: true, text: 'Date' } }
                    }
                }
            });
        }
    </script>
</body>
</html>
